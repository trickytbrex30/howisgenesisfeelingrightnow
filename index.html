/* Small DOM helper. Text always goes in through textContent, so nothing received can inject markup. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);

    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v);
  }
  el.append(...kids.filter(k => k != null));

}

  if (m < 60) return `${m} min ago`;
  const hrs = Math.round(m / 60);
  if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;

function dayLabel(key) {
  if (key === dayKey(Date.now())) return 'Today';
  if (key === dayKey(Date.now() - 864e5)) return 'Yesterday';
  const [y, m, d] = key.split('-').map(Number);

  if (error) { online = false; paint(); return; }

  entries = data.map(r => clean({ ...r.data, id: r.id })).filter(Boolean).sort((a, b) => b.t - a.t);
  paint();
}

async function saveEntry(entry) {
  const { error } = await db.from('entries').upsert({ id: entry.id, data: entry, at: new Date(entry.t).toISOString() });
  if (error) return failed('Could not save. Check your connection and try again.');
  online = true;
  await refreshFeelings();
  return true;
}

function composed(d) {
  const pts = d.pts.map(p => ({ e: p.e, t: p.t.trim() })).filter(p => p.t);
  const e = d.e || pts[0].e;
  return { e, x: d.x.trim() || (FEELINGS.find(f => f[0] === e) || [])[1] || 'A few things', pts };
}

async function shareFeeling() {
  const { e, x, pts } = composed(draft);
  const short = [...x].length > 70 ? `${[...x].slice(0, 67).join('')}…` : x;
  const t = Date.now();
  if (!await saveEntry({ id: `f${t}`, k: 'f', t, e, x, by: myTag(), pts })) return;
  draft = { e: '', x: '', pts: [] };
  showHome();
  notify(`${e} ${you()}: ${short}`,
    [short === x ? '' : x, ...pts.map((p, i) => `${i + 1}. ${p.e} ${p.t}`), `Changed at ${clock(t)}`].filter(Boolean).join('\n'));
  toast(`Sent to ${them()}`);
}

function editFeeling(entry) {
  const d = { e: entry.e, x: entry.x, pts: entry.pts.map(p => ({ ...p })) };
  sheet('Edit this feeling', (close) => [feelingForm(d, { action: 'Save changes', run: async () => {
    const next = { ...entry, ...composed(d), ed: { by: myTag(), t: Date.now() } };
    if (!await saveEntry(next)) return;
    close();
    notify(`✏️ ${you()} edited a feeling`, `${next.e} ${next.x}`.slice(0, 200));
    toast('Saved');
  } })]);
}

async function rateDay(v) {
  const t = Date.now();
  if (!await saveEntry({ id: `r${dayKey(t)}`, k: 'r', t, v })) return;
  notify(`${you()} rated today ${v}/10`, `Sent at ${clock(t)}`);
  toast(`Rated today ${v}/10`);
}

const feelingBy = (e, by) => e.k === 'f' && e.by === by;
const latestFeeling = (by) => entries.find(e => feelingBy(e, by));
const todaysRating = () => entries.find(e => e.k === 'r' && dayKey(e.t) === dayKey(Date.now()));

function pointsList(pts) {
  if (!pts || !pts.length) return null;

    h('span', { className: 'pt-num', text: i + 1 }),
    h('span', { className: 'pt-ico', text: p.e }),
    h('span', { className: 'pt-txt', text: p.t }),
  )));
}

const editLink = (entry) => h('button', { className: 'link', type: 'button', text: 'Edit', on: { click: () => editFeeling(entry) } });
const whenText = (e, start) => (e.ed ? `${start} · ${editedBy(e.ed.by)}` : start);

function paintHero() {
  const f = latestFeeling(theirTag());
  const words = f ? f.x : 'Nothing shared yet';
  slots.hero.replaceChildren(...[
    h('div', { className: 'who', text: `${them()} right now` }),

function paintRating() {
  const r = todaysRating();

function paintLog() {
  const items = [];

  for (const e of entries.slice(0, 80)) {

      h('div', { className: 'txt' }, ...[

  paintHero();

    d.e = e;

    heading ? h('h2', { text: heading }) : null,

/* ---- Ideas: shared albums of notes, drawings and photos ---- */

async function refreshIdeas() {
  const [a, b] = await Promise.all([
    db.from('albums').select('*').order('made_at', { ascending: false }),
    db.from('album_items').select('*').order('made_at', { ascending: false }),
  ]);
  if (a.error || b.error) { online = false; paint(); return; }
  online = true;
  // Only redraw when something changed (or photo links are near expiry), so the page never jumps while reading.
  const seen = JSON.stringify([a.data, b.data, Math.floor(Date.now() / 3e6)]);
  if (seen === ideas.seen) { paint(); return; }
  ideas.seen = seen;
  ideas.albums = a.data;
  ideas.items = b.data;
  ideas.loaded = true;
  if (ideas.open && !ideas.albums.some(x => x.id === ideas.open)) { ideas.open = null; composing = null; if (slots.ideas) showIdeas(); }
  await paintIdeas();
}

async function linkFiles(paths) {
  const need = [...new Set(paths)].filter(p => { const l = links.get(p); return !l || l.until < Date.now(); });
  if (!need.length) return;
  const { data, error } = await db.storage.from(BUCKET).createSignedUrls(need, 3600);
  if (error) return;
  for (const r of data) if (r.signedUrl) links.set(r.path, { url: r.signedUrl, until: Date.now() + 3000 * 1000 });
}
const linkTo = (path) => (links.get(path) || {}).url || '';

const itemsIn = (id) => ideas.items.filter(i => i.album_id === id);
const coverOf = (id) => itemsIn(id).find(i => i.file_path);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const albumById = (id) => ideas.albums.find(a => a.id === id);
const albumsIn = (id) => ideas.albums.filter(a => a.parent_id === id);

/* An album plus every album inside it, however deep. */
function familyOf(id, seen = new Set()) {
  if (seen.has(id)) return [];
  seen.add(id);
  return [id, ...albumsIn(id).flatMap(a => familyOf(a.id, seen))];
}

function pathOf(album) {
  const parts = [];
  for (let a = album; a && !parts.includes(a.title); a = albumById(a.parent_id)) parts.unshift(a.title);
  return parts.join(' › ');
}

function matchOf(album, q) {
  if (!q) return { hit: true, snippet: '' };
  if (album.title.toLowerCase().includes(q)) return { hit: true, snippet: '' };
  const note = itemsIn(album.id).find(i => i.body.toLowerCase().includes(q));
  return note ? { hit: true, snippet: note.body } : { hit: false, snippet: '' };
}

async function paintIdeas() {
  if (slots.status) paint();
  if (!slots.ideas) return;
  if (slots.albumList) {
    const q = ideas.q.trim().toLowerCase();
    // Searching looks inside every album; browsing shows only the top level.
    const found = ideas.albums.filter(a => q || !a.parent_id).map(a => ({ a, ...matchOf(a, q) })).filter(r => r.hit)
      .map(r => ({ ...r, snippet: r.snippet || (r.a.parent_id ? `In ${pathOf(albumById(r.a.parent_id))}` : '') }));
    await linkFiles(found.map(r => coverOf(r.a.id)).filter(Boolean).map(i => i.file_path));
    if (!slots.albumList) return;
    slots.albumList.replaceChildren(...(found.length ? found.map(albumCard) : [h('p', { className: 'muted', text:
      !ideas.loaded ? 'Loading your albums…' : q ? `Nothing found for "${ideas.q.trim()}".` : 'No albums yet. Make your first one above.' })]));
  }
  if (slots.subList) {
    const inside = albumsIn(ideas.open);
    await linkFiles(inside.map(a => coverOf(a.id)).filter(Boolean).map(i => i.file_path));
    if (!slots.subList) return;
    slots.subList.replaceChildren(...inside.map(a => albumCard({ a, snippet: '' })));
  }
  if (slots.itemList) {
    const list = itemsIn(ideas.open);
    await linkFiles(list.filter(i => i.file_path).map(i => i.file_path));
    if (!slots.itemList) return;
    slots.itemList.replaceChildren(...(list.length ? list.map(itemCard) : [h('p', { className: 'muted', text: 'Nothing in here yet. Write, draw or add a photo.' })]));
  }
}

function albumCard({ a, snippet }) {
  const cover = coverOf(a.id);
  const inside = albumsIn(a.id).length;
  const count = [inside ? plural(inside, 'album') : '', plural(itemsIn(a.id).length, 'thing')].filter(Boolean).join(' · ');
  return h('button', { className: 'album', type: 'button', on: { click: () => { ideas.open = a.id; composing = null; showIdeas(); } } },
    cover && linkTo(cover.file_path)
      ? h('img', { src: linkTo(cover.file_path), alt: '', loading: 'lazy' })
      : h('span', { className: 'album-blank', text: '♡' }),
    h('span', { className: 'album-title', text: a.title }),
    h('span', { className: 'album-meta', text: snippet || `${count} · by ${nameOf(a.made_by)}` }),
  );
}

function twoTapDelete(label, run) {
  const yes = h('button', { className: 'link danger', type: 'button', hidden: true, text: 'Yes, delete', on: { click: run } });
  const ask = h('button', { className: 'link', type: 'button', text: label, on: { click: () => { ask.hidden = true; yes.hidden = false; } } });
  return h('span', {}, ask, yes);
}

function itemCard(item) {
  const body = item.kind === 'note'
    ? h('p', { className: 'note', text: item.body })
    : h('img', { src: linkTo(item.file_path), alt: item.kind === 'drawing' ? 'Drawing' : 'Photo', loading: 'lazy' });
  return h('article', { className: `item ${item.kind}` }, body,
    h('footer', {},
      h('span', { text: [
        `${nameOf(item.made_by)} · ${ago(new Date(item.made_at).getTime())}`,
        item.edited_by ? editedBy(item.edited_by) : '',
      ].filter(Boolean).join(' · ') }),
      h('span', { className: 'item-tools' },
        item.kind === 'note' ? h('button', { className: 'link', type: 'button', text: 'Edit', on: { click: () => editNote(item) } }) : null,
        twoTapDelete('Delete', () => deleteItem(item)),
      ),
    ),
  );
}

function editNote(item) {
  const text = h('textarea', { rows: 8, maxLength: 5000, value: item.body, 'aria-label': 'Your note' });
  const save = h('button', { className: 'primary', type: 'submit', text: 'Save changes' });
  sheet('Edit this note', (close) => [h('form', { className: 'stack', on: { submit: async (ev) => {
    ev.preventDefault();
    const body = text.value.trim();
    if (!body) return;
    save.disabled = true;
    const { data, error } = await db.from('album_items')
      .update({ body, edited_by: myTag(), edited_at: new Date().toISOString() }).eq('id', item.id).select().single();
    save.disabled = false;
    if (error) { failed('Could not save. Check your connection and try again.'); return; }
    ideas.items = ideas.items.map(i => (i.id === data.id ? data : i));
    close();
    await paintIdeas();
    notify(`✏️ ${you()} edited a note in ${albumById(item.album_id).title}`, body.slice(0, 200));
    toast('Saved');
  } } }, text, save)]);
}

async function createAlbum(title, parent = null) {
  const { data, error } = await db.from('albums').insert({ title, parent_id: parent, made_by: myTag() }).select().single();
  if (error) return failed('Could not make the album. Check your connection and try again.');
  ideas.albums.unshift(data);
  ideas.open = data.id;
  composing = null;
  showIdeas();
  notify(`📒 ${you()} made an album`, pathOf(data));
  return true;
}

function chooseHome(album) {
  const family = familyOf(album.id);
  const homes = ideas.albums.filter(a => !family.includes(a.id) && a.id !== album.parent_id);
  sheet('Move this album', (close) => {
    const pick = (label, parent) => h('button', { className: 'ghost', type: 'button', text: label, on: { click: () => moveAlbum(album, parent, close) } });
    return [
      album.parent_id ? pick('All albums (top level)', null) : null,
      ...homes.map(a => pick(pathOf(a), a.id)),
      !album.parent_id && !homes.length ? h('p', { className: 'muted', text: 'Make another album first, then you can move this one into it.' }) : null,
    ].filter(Boolean);
  });
}

async function moveAlbum(album, parent, close) {
  const { error } = await db.from('albums').update({ parent_id: parent }).eq('id', album.id);
  if (error) { failed('Could not move it. Check your connection and try again.'); return; }
  album.parent_id = parent;
  close();
  showIdeas();
  toast('Moved');
}

async function addItem(row, what) {
  const album = ideas.albums.find(a => a.id === ideas.open);
  const { data, error } = await db.from('album_items').insert({ ...row, album_id: album.id, made_by: myTag() }).select().single();
  if (error) return failed('Could not save. Check your connection and try again.');
  ideas.items.unshift(data);
  await paintIdeas();
  notify(`📒 ${you()} added ${what} to ${album.title}`, (row.body || 'Tap to see it').slice(0, 200));
  return true;
}

async function uploadFile(blob, ext) {
  const path = `${crypto.randomUUID()}.${ext}`;
  const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType: blob.type });
  return error ? null : path;
}

async function deleteItem(item) {
  if (item.file_path) await db.storage.from(BUCKET).remove([item.file_path]);
  const { error } = await db.from('album_items').delete().eq('id', item.id);
  if (error) return failed('Could not delete. Check your connection and try again.');
  ideas.items = ideas.items.filter(i => i.id !== item.id);
  await paintIdeas();
}

async function deleteAlbum(id) {
  const family = familyOf(id);
  const parent = albumById(id).parent_id;
  const files = ideas.items.filter(i => family.includes(i.album_id) && i.file_path).map(i => i.file_path);
  if (files.length) await db.storage.from(BUCKET).remove(files);
  const { error } = await db.from('albums').delete().eq('id', id);
  if (error) return failed('Could not delete. Check your connection and try again.');
  ideas.albums = ideas.albums.filter(a => !family.includes(a.id));
  ideas.items = ideas.items.filter(i => !family.includes(i.album_id));
  ideas.open = parent;
  showIdeas();
}

function showIdeas() {
  slots.albumList = null;
  slots.subList = null;
  slots.itemList = null;
  if (ideas.open) showAlbum(); else showAlbumList();
  paintIdeas();
}

function showAlbumList() {
  const title = h('input', { id: 'album-title', maxLength: 80, autocomplete: 'off', placeholder: 'Date ideas, trip plans…', 'aria-label': 'New album name' });
  const search = h('input', { id: 'album-search', type: 'search', autocomplete: 'off', placeholder: 'Search albums and notes', 'aria-label': 'Search albums', value: ideas.q,
    on: { input: (ev) => { ideas.q = ev.target.value; paintIdeas(); } } });
  slots.albumList = h('div', { className: 'albums' });
  slots.ideas.replaceChildren(
    search,
    h('form', { className: 'copyline', on: { submit: async (ev) => {
      ev.preventDefault();
      const name = title.value.trim();
      if (name) await createAlbum(name);
    } } },
      title,
      h('button', { className: 'ghost', type: 'submit', text: 'New album' }),
    ),
    slots.albumList,
  );
}

function showAlbum() {
  const album = ideas.albums.find(a => a.id === ideas.open);
  if (!album) { ideas.open = null; return showAlbumList(); }
  const parent = albumById(album.parent_id);
  slots.composer = h('div', { className: 'stack' });
  slots.subList = h('div', { className: 'albums' });
  slots.itemList = h('div', { className: 'stack' });
  const picker = h('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true, on: { change: async (ev) => {
    const files = [...ev.target.files];
    ev.target.value = '';
    await addPhotos(files);
  } } });
  const action = (label, fn) => h('button', { className: 'ghost', type: 'button', text: label, on: { click: fn } });
  const open = (mode) => () => { composing = composing === mode ? null : mode; paintComposer(); };
  slots.ideas.replaceChildren(
    h('button', { className: 'link back', type: 'button', text: `‹ ${parent ? parent.title : 'All albums'}`, on: { click: () => {
      ideas.open = parent ? parent.id : null;
      composing = null;
      showIdeas();
    } } }),
    h('h2', { text: album.title }),
    h('div', { className: 'actions' }, action('Write', open('note')), action('Draw', open('draw')), action('Photo', () => picker.click()), action('Album', open('album')), picker),
    slots.composer,
    slots.subList,
    slots.itemList,
    h('p', { className: 'small album-tools' },
      h('button', { className: 'link', type: 'button', text: 'Move this album', on: { click: () => chooseHome(album) } }),
      twoTapDelete('Delete this album', () => deleteAlbum(album.id)),
    ),
  );
  paintComposer();
}

function paintComposer() {
  if (composing === 'note') slots.composer.replaceChildren(noteComposer());
  else if (composing === 'draw') slots.composer.replaceChildren(padNode ||= drawPad());
  else if (composing === 'album') slots.composer.replaceChildren(albumComposer());
  else slots.composer.replaceChildren();
}

function albumComposer() {
  const title = h('input', { id: 'inner-title', maxLength: 80, autocomplete: 'off', placeholder: 'Name the album inside', 'aria-label': 'New album name' });
  return h('form', { className: 'copyline', on: { submit: async (ev) => {
    ev.preventDefault();
    const name = title.value.trim();
    if (name) await createAlbum(name, ideas.open);
  } } }, title, h('button', { className: 'ghost', type: 'submit', text: 'Add' }));
}

function noteComposer() {
  const text = h('textarea', { id: 'note-text', rows: 5, maxLength: 5000, placeholder: 'Write your idea…', 'aria-label': 'Your note' });
  const save = h('button', { className: 'primary', type: 'submit', text: 'Save note' });
  return h('form', { className: 'stack', on: { submit: async (ev) => {
    ev.preventDefault();
    const body = text.value.trim();
    if (!body) return;
    save.disabled = true;
    const ok = await addItem({ kind: 'note', body }, 'a note');
    save.disabled = false;
    if (ok) { composing = null; paintComposer(); toast('Saved'); }
  } } }, text, save);
}

async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, PHOTO_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = h('canvas', { width: Math.round(img.naturalWidth * scale), height: Math.round(img.naturalHeight * scale) });
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return await new Promise(done => canvas.toBlob(done, 'image/jpeg', 0.85));
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function addPhotos(files) {
  let added = 0;
  for (const [i, file] of files.entries()) {
    toast(files.length > 1 ? `Adding photo ${i + 1} of ${files.length}…` : 'Adding photo…');
    let blob = null;
    try { blob = await shrinkPhoto(file); } catch {}
    if (!blob) { toast('That photo could not be read. Try a different one.'); continue; }
    const path = await uploadFile(blob, 'jpg');
    if (!path) { failed('Could not upload. Check your connection and try again.'); return; }
    if (await addItem({ kind: 'photo', file_path: path }, 'a photo')) added++;
  }
  if (added) toast(added === files.length ? 'Added' : `Added ${added} of ${files.length} photos`);
}

function drawPad() {
  const canvas = h('canvas', { className: 'pad', width: PAD_SIZE, height: PAD_SIZE, 'aria-label': 'Drawing pad' });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, PAD_SIZE, PAD_SIZE);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let ink = INKS[1];
  let nib = NIBS[1][1];
  let last = null;
  const undo = [];

  const at = (ev) => {
    const r = canvas.getBoundingClientRect();
    return [(ev.clientX - r.left) * (PAD_SIZE / r.width), (ev.clientY - r.top) * (PAD_SIZE / r.height)];
  };
  const stroke = (from, to) => {
    ctx.strokeStyle = ink;
    ctx.lineWidth = nib;
    ctx.beginPath();
    ctx.moveTo(...from);
    ctx.lineTo(...to);
    ctx.stroke();
  };
  canvas.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    undo.push(ctx.getImageData(0, 0, PAD_SIZE, PAD_SIZE));
    if (undo.length > 10) undo.shift();
    last = at(ev);
    stroke(last, last);
  });
  canvas.addEventListener('pointermove', (ev) => {
    if (!last) return;
    ev.preventDefault();
    const next = at(ev);
    stroke(last, next);
    last = next;
  });
  const lift = () => { last = null; };
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);

  const swatches = h('div', { className: 'swatches' });
  const choose = (color) => {
    ink = color;
    [...swatches.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ink === color)));
  };
  for (const color of [...INKS, '#ffffff']) {
    swatches.append(h('button', {
      type: 'button', 'data-ink': color, style: `background:${color}`, 'aria-pressed': String(color === ink),
      'aria-label': color === '#ffffff' ? 'Eraser' : `Colour ${color}`, on: { click: () => choose(color) },
    }));
  }
  const nibs = h('div', { className: 'nibs' });
  for (const [label, size] of NIBS) {
    nibs.append(h('button', { type: 'button', text: label, 'aria-pressed': String(size === nib), on: { click: (ev) => {
      nib = size;
      [...nibs.children].forEach(b => b.setAttribute('aria-pressed', String(b === ev.currentTarget)));
    } } }));
  }
  const save = h('button', { className: 'primary', type: 'button', text: 'Save drawing', on: { click: async () => {
    if (!undo.length) { toast('Draw something first'); return; }
    save.disabled = true;
    const blob = await new Promise(done => canvas.toBlob(done, 'image/png'));
    const path = blob && await uploadFile(blob, 'png');
    if (!path) { save.disabled = false; failed('Could not upload. Check your connection and try again.'); return; }
    const ok = await addItem({ kind: 'drawing', file_path: path }, 'a drawing');
    save.disabled = false;
    if (ok) { composing = null; padNode = null; paintComposer(); toast('Saved'); }
  } } });
  const tool = (label, fn) => h('button', { type: 'button', text: label, on: { click: fn } });
  return h('div', { className: 'stack' }, canvas, swatches,
    h('div', { className: 'pad-row' }, nibs,
      h('div', { className: 'nibs' },
        tool('Undo', () => { if (undo.length) ctx.putImageData(undo.pop(), 0, 0); }),
        tool('Clear', () => {
          undo.push(ctx.getImageData(0, 0, PAD_SIZE, PAD_SIZE));
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, PAD_SIZE, PAD_SIZE);
        }),
      ),
    ),
    save,
  );
}

/* ---- Sign-in ---- */

function showMessage(title, text) {
  app.replaceChildren(
    h('header', { className: 'top' }, h('h1', { className: 'brand', text: SITE })),
    h('section', { className: 'stack' }, h('h2', { text: title }), h('p', { text })),
  );
}

function showLogin() {
  const email = h('input', { id: 'email', type: 'email', required: true, autocomplete: 'username', autocapitalize: 'none' });
  const password = h('input', { id: 'password', type: 'password', required: true, autocomplete: 'current-password' });
  const go = h('button', { className: 'primary', type: 'submit', text: 'Log in' });
  app.replaceChildren(
    h('header', { className: 'top' }, h('h1', { className: 'brand', text: SITE })),
    h('form', { className: 'stack', on: { submit: async (ev) => {
      ev.preventDefault();
      go.disabled = true;
      const { data, error } = await db.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
      go.disabled = false;
      if (error) { toast(error.status === 400 ? 'Wrong email or password.' : 'Could not log in. Check your connection.'); return; }
      enter(data.session);
    } } },
      h('h2', { text: 'Log in' }),
      h('p', { className: 'muted', text: 'Just for the two of you. You only need to do this once on each phone.' }),
      h('label', { htmlFor: 'email' }, 'Email', email),
      h('label', { htmlFor: 'password' }, 'Password', password),
      go,
    ),
  );
}

function showWho(session) {
  const pick = (tag) => h('button', { className: 'primary', type: 'button', text: `I'm ${PEOPLE[tag]}`, on: { click: () => {
    saveLocal({ me: tag });
    enter(session);
  } } });
  app.replaceChildren(
    h('header', { className: 'top' }, h('h1', { className: 'brand', text: SITE })),
    h('section', { className: 'stack' }, h('h2', { text: 'Who is this?' }), pick('s'), pick('p')),
  );
}

let listening = false;
function listen() {
  if (listening) return;
  listening = true;
  const soon = (fn) => { let wait; return () => { clearTimeout(wait); wait = setTimeout(fn, 300); }; };
  const on = (table, fn) => ['postgres_changes', { event: '*', schema: 'public', table }, soon(fn)];
  const ideasChanged = soon(refreshIdeas);
  db.channel('everything')
    .on(...on('entries', refreshFeelings))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'albums' }, ideasChanged)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'album_items' }, ideasChanged)
    .subscribe();
  const check = () => { if (!document.hidden) { refreshFeelings(); refreshIdeas(); } };
  setInterval(check, POLL_MS);
  document.addEventListener('visibilitychange', check);
}

async function enter(session) {
  me = USERS[session.user.id] || loadLocal().me;
  if (!me) { showWho(session); return; }
  try {
    await loadConfig();
  } catch {
    showMessage('Could not connect', 'Check your connection, then open the page again.');
    return;
  }
  showHome();
  refreshFeelings();
  refreshIdeas();
  listen();
}

async function boot() {
  if (!db) { showMessage('Could not load', 'Check your connection, then open the page again.'); return; }
  const { data } = await db.auth.getSession();
  if (data.session) enter(data.session); else showLogin();
}
boot();
</script>
